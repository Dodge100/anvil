<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="toolbar">
  <h1 class="toolbar__title">Skyline</h1>
  <div class="toolbar__picker" role="group" aria-label="Scene theme">
    <button data-theme="live" data-active aria-pressed="true">Auto</button>
    <button data-theme="cycle" aria-pressed="false">Cycle</button>
    <button data-theme="sunrise" aria-pressed="false">Sunrise</button>
    <button data-theme="day" aria-pressed="false">Day</button>
    <button data-theme="sunset" aria-pressed="false">Sunset</button>
    <button data-theme="night" aria-pressed="false">Night</button>
  </div>
</header>

<main>
  <div class="landscape" id="landscape" role="img" aria-label="Layered city skyline at the current time of day">
    <div class="landscape__stars" id="stars" aria-hidden="true"></div>
    <div class="landscape__sunWrap" id="sunWrap" aria-hidden="true">
      <div class="landscape__orb landscape__orb--sun" id="sun"></div>
      <div class="landscape__orb landscape__orb--moon" id="moon"></div>
    </div>
    <div class="landscape__svg" id="svgHost" aria-hidden="true">
</div>
  </div>
  <section class="content">
    <p>Auto syncs the skyline to your local time. Cycle loops through a full day every 60 seconds.</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
